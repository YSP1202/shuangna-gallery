
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="SHUANGNA，记录生活中的美好瞬间。">
  <title>SHUANGNA — 收藏美好时光</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    header {
      max-width: 1440px;
      margin: auto;
      padding: 48px 5% 30px;
    }

    .logo {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 10px;
      color: #888;
      font-size: 14px;
      letter-spacing: 1px;
    }

    main {
      max-width: 1440px;
      min-height: 65vh;
      margin: auto;
      padding: 65px 5%;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .photo {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      cursor: pointer;
      border-radius: 3px;
      transition: opacity .25s;
    }

    .photo:hover {
      opacity: .88;
    }

    .empty {
      text-align: center;
      padding: 65px 15px 90px;
      color: #888;
    }

    .empty h2 {
      font-size: 18px;
      font-weight: 400;
      color: #555;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 14px;
      margin: 0;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      padding: 35px 15px 50px;
    }

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.94);
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .viewer.show {
      display: flex;
    }

    .viewer img {
      max-width: 90%;
      max-height: 85vh;
      object-fit: contain;
    }

    .viewer button {
      position: absolute;
      border: 0;
      background: transparent;
      color: white;
      font-size: 36px;
      cursor: pointer;
      padding: 10px 18px;
    }

    #close {
      top: 15px;
      right: 20px;
    }

    #prev {
      left: 10px;
    }

    #next {
      right: 10px;
    }

    @media (max-width: 768px) {
      header {
        padding: 35px 6% 20px;
      }

      .logo {
        font-size: 25px;
      }

      main {
        padding: 40px 5%;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }

      .empty {
        padding-top: 75px;
      }
    }

    @media (max-width: 420px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">SHUANGNA</div>
    <div class="subtitle">珍藏时光，记录美好。</div>
  </header>

  <main>
    <div class="gallery" id="gallery"></div>

    <div class="empty" id="empty">
      <h2>每一段时光，都值得珍藏。</h2>
      <p>精选照片将在这里呈现。</p>
    </div>
  </main>

  <footer>
    A personal collection of memories.
  </footer>

  <div class="viewer" id="viewer">
    <button id="close" aria-label="关闭">×</button>
    <button id="prev" aria-label="上一张">‹</button>
    <img id="viewerImage" alt="照片大图">
    <button id="next" aria-label="下一张">›</button>
  </div>

  <script>
    // 将照片上传到 images 文件夹后，在这里填写文件名
    const photos = [
      // "images/photo-01.jpg",
      // "images/photo-02.jpg",
      // "images/photo-03.jpg"
    ];

    const gallery = document.getElementById("gallery");
    const empty = document.getElementById("empty");
    const viewer = document.getElementById("viewer");
    const viewerImage = document.getElementById("viewerImage");

    let current = 0;

    function renderGallery() {
      gallery.innerHTML = "";

      empty.style.display = photos.length ? "none" : "block";

      photos.forEach((src, index) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "SHUANGNA 精选照片";
        img.className = "photo";
        img.loading = "lazy";

        img.addEventListener("click", () => openViewer(index));
        gallery.appendChild(img);
      });
    }

    function openViewer(index) {
      current = index;
      viewerImage.src = photos[current];
      viewer.classList.add("show");
    }

    function changePhoto(step) {
      if (!photos.length) return;

      current = (current + step + photos.length) % photos.length;
      viewerImage.src = photos[current];
    }

    document.getElementById("close").onclick = () => {
      viewer.classList.remove("show");
    };

    document.getElementById("prev").onclick = () => changePhoto(-1);
    document.getElementById("next").onclick = () => changePhoto(1);

    viewer.addEventListener("click", event => {
      if (event.target === viewer) {
        viewer.classList.remove("show");
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") viewer.classList.remove("show");
      if (event.key === "ArrowLeft") changePhoto(-1);
      if (event.key === "ArrowRight") changePhoto(1);
    });

    renderGallery();
  </script>

</body>
</html>
